name: SSF mantle-water module build
on:
  pull_request:
    paths:
      - 'lib/didacticScienceFoundations.ts'
      - '.github/workflows/mantle-water-module-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
