id: MAG-006
type: LearningModule
status: draft
language: { primary: de, planned: [en] }
title: { de: Vom Rohstoff zum Magneten, en: From raw material to magnet }
summary:
  de: Verknüpft Rohstoff, Zusammensetzung, Mikrostruktur, Verarbeitung, Funktion, kritische Rohstoffe und Recycling zu einer Werkstoff-Prozesskette.
level: { ssf_level: N3, academic_context: Materialwissenschaft / Produktion }
knowledge_domain: KD:MAT-MAGNETIC-PROCESSING:N3
duration_minutes: 50
learning_objectives:
  de:
    - Rohstoff, chemische Zusammensetzung, Mikrostruktur und Funktion unterscheiden.
    - Erklären, wie Verarbeitung die Mikrostruktur und damit magnetische Eigenschaften beeinflusst.
    - Magnetwerkstoffe als technische Prozesskette modellieren.
    - Kritische Rohstoffe und Recycling als Teil der Werkstoffentscheidung einordnen.
    - Technische Recyclingfähigkeit von realen End-of-Life-Rückgewinnungsquoten und industrieller Kapazität unterscheiden.
prerequisites: { modules: [MAG-005] }
key_concepts: [CON:MAT:composition, CON:MAT:microstructure, CON:MAT:processing, CON:MAT:critical-raw-materials, CON:MAT:recycling]
canonical_examples:
  - id: EX:MAG:006:001
    title: { de: NdFeB von Rohstoff und Pulverprozess zum Motorbauteil, en: NdFeB from raw materials and powder processing to motor component }
relations: { requires: [MAG-005], precedes: [MAG-007] }
evidence_policy:
  de: Volatile Marktwerte, Produktionskonzentrationen, Exportregeln, Recyclingquoten und Kapazitäten sind datierte Evidenz und keine invarianten Concept-Eigenschaften.
ssf_notes:
  de: Dieses Modul bildet die Brücke zur allgemeinen SSF-Säule Materialwissenschaft: Zusammensetzung + Struktur + Prozess + Umwelt bestimmen die Funktion. MAG-006 ist eine lokale SSF-Draft-ID und keine KG-kanonische LearningModule-ID.
