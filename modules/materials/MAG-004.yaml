  de:
    - Ferrit, AlNiCo, SmCo und NdFeB als Werkstoffklassen einordnen.
    - Magnetische Stärke nicht mit genereller technischer Eignung gleichsetzen.
    - Temperaturbeständigkeit, Korrosion, Kosten und Rohstoffverfügbarkeit als Auswahlkriterien nutzen.
