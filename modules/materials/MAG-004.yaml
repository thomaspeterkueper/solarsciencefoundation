title: { de: Permanentmagnete als Werkstoffe, en: Permanent magnets as materials }
summary:
  de: Vergleich von Ferrit, AlNiCo, SmCo und NdFeB anhand magnetischer Leistung, Temperaturverhalten, Korrosion, Kosten und Rohstoffabhängigkeit.
level: { ssf_level: N2, academic_context: Materialwissenschaft }
