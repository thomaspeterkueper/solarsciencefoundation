<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Erdumfang nach Eratosthenes</title>
  <desc id="d">Parallele Sonnenstrahlen treffen die Erde. In Syene steht ein Stab genau in Richtung der Sonne und wirft keinen Schatten. In Alexandria weiter nördlich wirft ein Stab einen Schatten unter einem kleinen Winkel. Derselbe Winkel liegt im Erdmittelpunkt zwischen den beiden Orten. Der Winkel ist zur Deutlichkeit vergrößert gezeichnet.</desc>
  <rect width="380" height="330" rx="12" fill="#F7F5EF"/>
  <circle cx="150" cy="170" r="100" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <g stroke="#EF9F27" stroke-width="1.2">
    <line x1="150" y1="8" x2="150" y2="46"/>
    <line x1="108.3" y1="8" x2="108.3" y2="53"/>
  </g>
  <g stroke="#2C2C2A" stroke-width="2.5">
    <line x1="150" y1="70" x2="150" y2="48"/>
    <line x1="115.8" y1="76" x2="108.3" y2="55.3"/>
  </g>
  <g stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 4">
    <line x1="150" y1="170" x2="150" y2="70"/>
    <line x1="150" y1="170" x2="115.8" y2="76"/>
  </g>
  <path d="M150 140 A30 30 0 0 0 139.7 141.8" fill="none" stroke="#D85A30" stroke-width="1.5"/>
  <circle cx="150" cy="170" r="3" fill="#2C2C2A"/>
  <g font-size="12" fill="#2C2C2A">
    <text x="164" y="22">Sonnenstrahlen, parallel</text>
    <text x="160" y="64">Syene: kein Schatten</text>
    <text x="100" y="64" text-anchor="end">Alexandria</text>
    <text x="158" y="148" fill="#993C1D">7,2°</text>
    <text x="150" y="190" text-anchor="middle">Erdmittelpunkt</text>
    <text x="30" y="300">7,2° sind 1/50 des Vollkreises, also ist der</text>
    <text x="30" y="316">Erdumfang 50-mal die Strecke Syene–Alexandria.</text>
  </g>
</svg>
