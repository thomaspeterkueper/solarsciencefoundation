<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 310" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Prinzip des Nivellements</title>
  <desc id="d">Ein Nivelliergerät steht zwischen zwei Messlatten auf ansteigendem Gelände. Die waagerechte Ziellinie trifft die Latte bei A in 1,85 Metern und die Latte bei B in 0,60 Metern Höhe. Der Höhenunterschied ist Rückblick minus Vorblick, also 1,25 Meter.</desc>
  <rect width="380" height="310" rx="12" fill="#F7F5EF"/>
  <path d="M30 250 L350 200 L350 250 Z" fill="#E7E3D6"/>
  <line x1="30" y1="250" x2="350" y2="200" stroke="#888780" stroke-width="1.2"/>
  <rect x="56" y="115" width="8" height="130" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <rect x="316" y="75" width="8" height="130" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
  <g stroke="#5F5E5A" stroke-width="1.5">
    <line x1="190" y1="182" x2="178" y2="227"/>
    <line x1="190" y1="182" x2="202" y2="224"/>
  </g>
  <rect x="178" y="170" width="24" height="11" rx="2" fill="#5F5E5A"/>
  <line x1="64" y1="175" x2="316" y2="175" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/>
  <g fill="#D85A30">
    <circle cx="60" cy="175" r="3"/>
    <circle cx="320" cy="175" r="3"/>
  </g>
  <g font-size="12" fill="#2C2C2A">
    <text x="30" y="102">Rückblick 1,85 m</text>
    <text x="250" y="62">Vorblick 0,60 m</text>
    <text x="190" y="160" text-anchor="middle">Nivelliergerät</text>
    <text x="56" y="270">A</text>
    <text x="316" y="228">B</text>
    <text x="40" y="292">Höhenunterschied = 1,85 m − 0,60 m = 1,25 m</text>
  </g>
</svg>
