<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Erdradius aus der Kimmtiefe</title>
  <desc id="d">Ein Berg der Höhe h steht auf der gekrümmten Erde. Vom Gipfel aus liegt der Horizont um den kleinen Winkel theta unter der Waagerechten. Die Sichtlinie zum Horizont berührt die Erde; Radius zum Berührpunkt und Sichtlinie stehen rechtwinklig. Daraus folgt der Erdradius R gleich h mal cos theta geteilt durch eins minus cos theta. Berghöhe und Winkel sind stark vergrößert gezeichnet.</desc>
  <rect width="380" height="360" rx="12" fill="#F7F5EF"/>
  <path d="M36.8 201.4 A200 200 0 0 1 343.2 201.4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <polygon points="172,131 190,95 208,131" fill="#C0DD97" stroke="#3B6D11" stroke-width="1"/>
  <g stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 4">
    <line x1="190" y1="330" x2="190" y2="131"/>
    <line x1="190" y1="330" x2="295.1" y2="159.8"/>
  </g>
  <line x1="190" y1="95" x2="340" y2="95" stroke="#888780" stroke-width="1"/>
  <line x1="190" y1="95" x2="330" y2="181.3" stroke="#BA7517" stroke-width="1.2"/>
  <path d="M220 95 A30 30 0 0 1 215.5 110.8" fill="none" stroke="#D85A30" stroke-width="1.5"/>
  <circle cx="295.1" cy="159.8" r="3.5" fill="#D85A30"/>
  <circle cx="190" cy="330" r="3" fill="#2C2C2A"/>
  <g font-size="12" fill="#2C2C2A">
    <text x="20" y="30">R = h · cos θ : (1 − cos θ)</text>
    <text x="182" y="100" text-anchor="end">Berg, Höhe h</text>
    <text x="300" y="88">waagerecht</text>
    <text x="226" y="114" fill="#993C1D">θ</text>
    <text x="302" y="156">Horizont</text>
    <text x="182" y="250" text-anchor="end">R + h</text>
    <text x="250" y="250">R</text>
    <text x="190" y="350" text-anchor="middle">Erdmittelpunkt (nicht maßstäblich)</text>
  </g>
</svg>
