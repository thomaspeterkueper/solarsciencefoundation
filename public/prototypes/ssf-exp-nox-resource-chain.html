<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSF Trennlabor</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px;line-height:1.5}button{margin:4px;padding:9px 12px}.stream{border:1px solid #999;border-radius:8px;padding:10px;margin:8px 0}.ok{font-weight:700}small{display:block;margin-top:18px}</style></head><body><h1>Trennlabor: Kies + Sand + Eisen + Salz</h1><p>Baue die Prozesskette selbst. Unwirksame Schritte bleiben als Aufwand erhalten.</p><div id="buttons"></div><p><b>Kette:</b> <span id="chain">noch kein Schritt</span></p><div id="streams"></div><p id="cost"></p><p id="result"></p><small>Didaktisches Modell. Reale Aufbereitung erfordert stoff- und anlagenspezifische Messwerte, Verlust- und Sicherheitsbetrachtungen.</small><script>const labels={sieve:'Sieben',magnet:'Magnet einsetzen',dissolve:'In Wasser lösen',filter:'Filtrieren',evaporate:'Eindampfen'},cost={sieve:[1,0],magnet:[1,0],dissolve:[1,2],filter:[2,0],evaporate:[6,0]};let steps=[];function apply(ss,s){let n=[];for(const x of ss){let m=x.m,w=x.w;if(s==='sieve'&&m.includes('Kies')&&m.length>1){n.push({l:'Grobgut',m:['Kies'],w});n.push({l:'Siebdurchgang',m:m.filter(v=>v!=='Kies'),w})}else if(s==='magnet'&&m.includes('Eisen')&&m.length>1){n.push({l:'Magnetfraktion',m:['Eisen'],w});n.push({l:'Nichtmagnetisch',m:m.filter(v=>v!=='Eisen'),w})}else if(s==='dissolve'&&m.includes('Salz')&&!w)n.push({...x,l:x.l+' + Salzlösung',w:true});else if(s==='filter'&&w&&m.includes('Salz')&&m.some(v=>v!=='Salz')){n.push({l:'Filterkuchen',m:m.filter(v=>v!=='Salz'),w:false});n.push({l:'Filtrat',m:['Salz'],w:true})}else if(s==='evaporate'&&w)n.push({l:m.length===1&&m[0]==='Salz'?'Salzprodukt':x.l,m,w:false});else n.push(x)}return n}function render(){let ss=steps.reduce(apply,[{l:'Ausgangsgemisch',m:['Kies','Sand','Eisen','Salz'],w:false}]);chain.textContent=steps.length?steps.map(s=>labels[s]).join(' → '):'noch kein Schritt';streams.innerHTML=ss.map(x=>'<div class="stream"><b>'+x.l+'</b>: '+x.m.join(' + ')+(x.w?' in/mit Wasser':'')+'</div>').join('');let e=0,w=0;steps.forEach(s=>{e+=cost[s][0];w+=cost[s][1]});document.getElementById('cost').innerHTML='<b>Modellaufwand:</b> Energie '+e+' Punkte · Wasser '+w+' Einheiten';let pure=ss.filter(x=>x.m.length===1&&!x.w).map(x=>x.m[0]);let ok=['Kies','Sand','Eisen','Salz'].every(x=>pure.includes(x));result.className=ok?'ok':'';result.textContent=ok?'✓ Vollständig getrennt. Schaffst du es mit weniger Aufwand?':'Noch nicht vollständig getrennt. Welche Stoffeigenschaft kannst du als Nächstes ausnutzen?'}Object.keys(labels).forEach(s=>{let b=document.createElement('button');b.textContent=labels[s];b.onclick=()=>{steps.push(s);render()};buttons.appendChild(b)});let r=document.createElement('button');r.textContent='Neu starten';r.onclick=()=>{steps=[];render()};buttons.appendChild(r);render()</script></body></html>
